[package]
name = "iron_oxide"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sha1_smol = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
pyronyx = { version = "0.4", optional = true, features = ["rwh_06"] }
png = { version = "0.18", optional = true }
zip = { version = "8.1", optional = true }
rand = "0.10"
bitflags = "2.11"
ring = { version = "0.17", features = ["std"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = [
    "android-game-activity",
], optional = true }
ndk = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "wayland",
], optional = true }

[target.'cfg(all(not(target_os = "android"), not(target_os = "linux")))'.dependencies]
winit = { version = "0.30", optional = true }

[features]
default = ["vulkan"]
# Reading the system clipboard, which on wayland means speaking the protocol.
# Separable because it is linux-only and nothing else in the crate needs it.
clipboard = []
vulkan = ["pyronyx", "winit", "png", "ndk"]
x11 = ["winit/x11"]
# TLS comes along by default: an http client without https is barely useful.
# It stays separable because `ring` compiles C, which is worth avoiding on
# targets that only ever talk to localhost.
net = ["zip", "base64", "sha1_smol", "tls"]
tls = ["dep:ring"]
